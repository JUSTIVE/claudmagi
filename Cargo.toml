[package]
name = "claudmagi"
version = "0.1.0"
edition = "2024"
description = "A Metro start screen of your live Claude Code sessions"
license = "MIT"

[dependencies]
# Native Shell (#195): the window, its views and their motion are AppKit's
# own, drawn by Core Animation, rather than gpui's, and the Metro pieces are
# nsh-metro's, the design system rebuilt on it.
nsh-core = { version = "0.6.1", features = ["svg"] }
nsh-platform-macos = { version = "0.6.1", default-features = false, features = ["svg"] }
nsh-metro = { git = "https://github.com/JUSTIVE/nsh-metro", rev = "712496b108ece98e991c6cfc8845ff07a027bad1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
anyhow = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
# The marks are checked against the SVG parser the platform draws them with
# (#79, #80).
usvg = "0.46"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
