[package]
name = "claudmagi"
version = "0.1.0"
edition = "2024"
description = "Circuit-board view of your live Claude Code sessions"
license = "MIT"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
lyon = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
anyhow = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
objc = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
