[package]
name = "claudmagi"
version = "0.1.0"
edition = "2024"
description = "Circuit-board view of your live Claude Code sessions"
license = "MIT"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
# Flattens the chip marks into paths the board can draw, on screen and in an
# `--svg` export alike (#79, #80). Already in the tree underneath gpui.
usvg = "0.45"
# The platform backends left the gpui crate at this revision; `current_platform`
# lives here now and is what opens a real window (#115).
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d" }
# Headless components for gpui (#115). Tracks the same gpui revision.
base-gpui = { git = "https://github.com/LukeTandjung/base-gpui" }
lyon = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
anyhow = "1"
dirs = "6"
log = "0.4"
env_logger = "0.11"
objc = "0.2"
ttf-parser = "0.25"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

# base-gpui tracks gpui at a Zed revision rather than the release, and cargo
# treats the two as different crates: its `Window` would not be ours. The
# patch points everyone at the same one (#115).
[patch.crates-io]
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed", rev = "59b2ebf10351b5c0b5cd4403f01ed0460eeec06d" }
